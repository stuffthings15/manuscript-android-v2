org.gradle.jvmargs=-Xmx6144m -Dfile.encoding=UTF-8
org.gradle.workers.max=2
android.useAndroidX=true
kotlin.code.style=official
android.builder.sdkDownload=true
# app/build.gradle pins a Java 21 toolchain, and Gradle does not auto-detect
# the JDK that ships inside Android Studio, so name it here. No toolchain
# download repository is configured, which keeps the build offline. Point this
# at any Java 21 home if the Android Studio JDK moves or is not installed.
org.gradle.java.installations.paths=C\:/Program Files/Android/openjdk/jdk-21.0.8
