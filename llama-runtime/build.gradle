plugins {
    id "com.android.library"
}

android {
    namespace "com.arm.aichat"
    compileSdk 36
    ndkVersion "29.0.13113456"

    defaultConfig {
        minSdk 26

        ndk {
            abiFilters "arm64-v8a", "x86_64"
        }

        externalNativeBuild {
            cmake {
                arguments "-DCMAKE_BUILD_TYPE=Release",
                    "-DBUILD_SHARED_LIBS=ON",
                    "-DLLAMA_BUILD_APP=OFF",
                    "-DLLAMA_BUILD_COMMON=ON",
                    "-DLLAMA_OPENSSL=OFF",
                    "-DGGML_NATIVE=OFF",
                    "-DGGML_BACKEND_DL=ON",
                    "-DGGML_CPU_ALL_VARIANTS=ON",
                    "-DGGML_LLAMAFILE=OFF",
                    // Vulkan backend: on GPUs like the S23's Adreno the same
                    // model decodes several times faster than CPU. Built as a
                    // dlopen backend, so devices without a usable Vulkan
                    // driver silently keep the CPU path. glslc ships in the
                    // NDK; SPIRV-Headers is vendored (header-only).
                    // Vulkan is opt-in (-Pmanuscript.vulkan=true). It builds
                    // and links, and the Adreno 740 is detected with 7.3 GiB
                    // visible, but that driver aborts the whole process inside
                    // vk::Device::createComputePipeline. A C++ abort cannot be
                    // caught in-process, so enabling it by default would ship
                    // a hard crash. Shipping needs an isolated-process probe
                    // that survives the abort and disables the backend.
                    "-DGGML_VULKAN=${providers.gradleProperty('manuscript.vulkan').getOrElse('false')}",
                    "-DVulkan_GLSLC_EXECUTABLE=${System.getenv('LOCALAPPDATA')}/Android/Sdk/ndk/29.0.13113456/shader-tools/windows-x86_64/glslc.exe",
                    "-DSPIRV-Headers_DIR=${projectDir}/../vendor/spirv-headers/share/cmake/SPIRV-Headers",
                    "-DGGML_VULKAN_SHADERS_GEN_TOOLCHAIN=${projectDir}/../vendor/spirv-headers/msvc-host-toolchain.cmake",
                    // NDK ships only the C vulkan.h; the C++ vulkan.hpp comes
                    // from vendored Khronos Vulkan-Headers pinned to the same
                    // 1.3.275 API version as the NDK loader.
                    "-DCMAKE_CXX_FLAGS=-isystem \\\"${projectDir}/../vendor/vulkan-headers/include\\\" -isystem \\\"${projectDir}/../vendor/spirv-headers/include\\\""
                cppFlags "-O3"
            }
        }
    }

    externalNativeBuild {
        cmake {
            path file("../vendor/llama.cpp/examples/llama.android/lib/src/main/cpp/CMakeLists.txt")
            version "3.31.6"
            // Short staging dir: the Vulkan shader generator's nested
            // ExternalProject exceeds Windows' 250-character object-path
            // limit under the default .cxx location.
            buildStagingDirectory "C:/m/ll"
        }
    }

    sourceSets {
        main {
            manifest.srcFile "../vendor/llama.cpp/examples/llama.android/lib/src/main/AndroidManifest.xml"
            java.srcDirs = ["../vendor/llama.cpp/examples/llama.android/lib/src/main/java"]
            kotlin.srcDirs = ["../vendor/llama.cpp/examples/llama.android/lib/src/main/java"]
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

}

dependencies {
    implementation "androidx.core:core-ktx:1.15.0"
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-android:1.8.1"
}

def llamaVendorDirectory = providers.gradleProperty("manuscript.llamaVendorDirectory")
    .map { configuredPath -> file(configuredPath) }
    .getOrElse(file("../vendor/llama.cpp"))
def llamaVendorSentinels = [
    "examples/llama.android/lib/src/main/cpp/CMakeLists.txt": "825DDC929CDA8B0B5B9EA8272275F9A5D63638FE03E0D52B68529FE817E75A6F",
    "examples/llama.android/lib/src/main/cpp/ai_chat.cpp": "832C3A36F4A46DAB781376133B5A107E36C65A2E492B331ED045EDEBF4297DA2",
    "examples/llama.android/lib/src/main/cpp/logging.h": "B69C2B2DF513A041EA1EBEDE5A4DBEA81E52C8B021BBA0C2ED165DEB1B02F9FD",
    "examples/llama.android/lib/src/main/java/com/arm/aichat/InferenceEngine.kt": "B0280CEFE6C2195CCDB2612F81B8E5164275F7BC0C5FA9875C32A69B06F11C47",
    "examples/llama.android/lib/src/main/java/com/arm/aichat/internal/InferenceEngineImpl.kt": "C4774F8B687772478D78A5CC7A1B5C2D685CB712C38D0DE0811D700607DA7B76",
]

tasks.register("verifyManuscriptLlamaRuntime") {
    inputs.files(llamaVendorSentinels.keySet().collect { relativePath ->
        file("${llamaVendorDirectory}/${relativePath}")
    })

    doLast {
        if (!llamaVendorDirectory.isDirectory()) {
            throw new GradleException("Committed llama.cpp vendor source is missing.")
        }
        llamaVendorSentinels.each { relativePath, expectedHash ->
            def sourceFile = file("${llamaVendorDirectory}/${relativePath}")
            if (!sourceFile.isFile()) {
                throw new GradleException("Required llama.cpp source is missing: ${relativePath}")
            }
            def actualHash = java.security.MessageDigest.getInstance("SHA-256")
                .digest(sourceFile.bytes)
                .encodeHex()
                .toString()
                .toUpperCase(java.util.Locale.ROOT)
            if (actualHash != expectedHash) {
                throw new GradleException(
                    "Unexpected llama.cpp source hash for ${relativePath}. Expected ${expectedHash}, got ${actualHash}."
                )
            }
        }
    }
}

tasks.named("preBuild").configure {
    dependsOn("verifyManuscriptLlamaRuntime")
}
